[package]
name = "tensorgrid-protocol"
version = "0.1.0"
description = "Solana DePIN Smart Contract for TensorGrid GPU Compute Network"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "tensorgrid_protocol"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
anchor-lang = "0.30.1"
anchor-spl = "0.30.1"
solana-program = ">=1.18.0, <2.0.0"
